{% extends "base.html" %}

{% block title %}成绩录入 - 学校管理系统{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4"><i class="fas fa-pencil-alt me-2"></i>成绩录入</h2>

        <!-- 选择课程 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">选择课程</label>
                        <select class="form-select" id="courseSelect" onchange="loadCourseStudents()">
                            <option value="">请选择课程</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 学生成绩表 -->
        <div class="card" id="studentsCard" style="display: none;">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>学生成绩列表</h5>
                <div>
                    <button class="btn btn-sm btn-success" onclick="publishAll()"><i class="fas fa-paper-plane me-1"></i>批量发布</button>
                    <button class="btn btn-sm btn-primary" onclick="saveAll()"><i class="fas fa-save me-1"></i>保存成绩</button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>学号</th>
                                <th>姓名</th>
                                <th>成绩</th>
                                <th>成绩类型</th>
                                <th>发布</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentCourseId = null;

$(function() {
    loadCourses();
});

function loadCourses() {
    $.get('/grade/api/grades/teacher-courses', function(res) {
        if (res.success) {
            const select = $('#courseSelect');
            select.empty().append('<option value="">请选择课程</option>');
            res.data.forEach(function(c) {
                select.append(`<option value="${c.id}">${c.name} (${c.code}) - ${c.semester} [已录入${c.grade_count}人]</option>`);
            });
        }
    });
}

function loadCourseStudents() {
    const courseId = $('#courseSelect').val();
    currentCourseId = courseId;

    if (!courseId) {
        $('#studentsCard').hide();
        return;
    }

    $.get('/grade/api/grades/course/' + courseId + '/students', function(res) {
        if (res.success) {
            renderStudents(res.data);
            $('#studentsCard').show();
        }
    });
}

function renderStudents(students) {
    const tbody = $('#studentsTable');
    tbody.empty();

    if (students.length === 0) {
        tbody.html('<tr><td colspan="6" class="text-center text-muted py-4">该课程暂无选课学生</td></tr>');
        return;
    }

    students.forEach(function(s, index) {
        const hasGrade = s.grade_id !== null;
        const scoreVal = s.score !== null ? s.score : '';
        const published = s.is_published ? 'checked' : '';

        tbody.append(`
            <tr data-student-id="${s.student_id}">
                <td><code>${escHtml(s.student_number || '-')}</code></td>
                <td><strong>${escHtml(s.student_name)}</strong></td>
                <td>
                    <input type="number" class="form-control form-control-sm" style="width: 100px;"
                           id="score_${index}" value="${scoreVal}" min="0" max="100" step="0.1"
                           placeholder="分数">
                </td>
                <td>
                    <select class="form-select form-select-sm" style="width: 100px;" id="type_${index}">
                        <option value="final" ${s.grade_type === 'final' || !hasGrade ? 'selected' : ''}>期末</option>
                        <option value="mid-term" ${s.grade_type === 'mid-term' ? 'selected' : ''}>期中</option>
                        <option value="supplement" ${s.grade_type === 'supplement' ? 'selected' : ''}>补考</option>
                    </select>
                </td>
                <td>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="publish_${index}" ${published}>
                    </div>
                </td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="saveGrade(${index}, ${s.student_id})">
                        <i class="fas fa-save"></i>
                    </button>
                </td>
            </tr>
        `);
    });

    // 存储学生数据供保存使用
    window.courseStudents = students;
}

function saveGrade(index, studentId) {
    const score = $('#score_' + index).val();
    const gradeType = $('#type_' + index).val();
    const isPublished = $('#publish_' + index).prop('checked');

    $.ajax({
        url: '/grade/api/grades',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            student_id: studentId,
            course_id: currentCourseId,
            score: score !== '' ? parseFloat(score) : null,
            grade_type: gradeType,
            is_published: isPublished
        }),
        success: function(res) {
            if (res.success) {
                showToast('保存成功', 'success');
            } else {
                showToast(res.message, 'danger');
            }
        }
    });
}

function saveAll() {
    if (!window.courseStudents || window.courseStudents.length === 0) return;

    let saved = 0;
    window.courseStudents.forEach(function(s, index) {
        const score = $('#score_' + index).val();
        const gradeType = $('#type_' + index).val();
        const isPublished = $('#publish_' + index).prop('checked');

        $.ajax({
            url: '/grade/api/grades',
            method: 'POST',
            contentType: 'application/json',
            async: false,
            data: JSON.stringify({
                student_id: s.student_id,
                course_id: currentCourseId,
                score: score !== '' ? parseFloat(score) : null,
                grade_type: gradeType,
                is_published: isPublished
            }),
            success: function(res) {
                if (res.success) saved++;
            }
        });
    });

    showToast(`已保存 ${saved} 条成绩`, 'success');
}

function publishAll() {
    // 先保存所有成绩
    saveAll();
    // 然后将所有学生的成绩标记为已发布
    if (!window.courseStudents || window.courseStudents.length === 0) return;

    window.courseStudents.forEach(function(s, index) {
        $('#publish_' + index).prop('checked', true);
    });

    showToast('已标记全部为发布状态，请点击保存', 'info');
}

function showToast(msg, type) {
    let toast = document.getElementById('appToast');
    if (!toast) {
        const html = `<div class="toast align-items-center text-white border-0 bg-success position-fixed top-0 start-50 translate-middle-x mt-5" id="appToast" role="alert"><div class="d-flex"><div class="toast-body" id="toastMsg"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>`;
        $('body').append(html);
        toast = document.getElementById('appToast');
    }
    toast.className = 'toast align-items-center text-white border-0 bg-' + (type || 'success');
    document.getElementById('toastMsg').textContent = msg;
    new bootstrap.Toast(toast, {delay: 3000}).show();
}

function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
{% endblock %}
