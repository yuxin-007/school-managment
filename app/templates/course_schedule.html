{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-calendar-alt me-2"></i>课表查看</h2>
    <div><button class="btn btn-outline-primary" id="refreshScheduleBtn"><i class="fas fa-sync-alt me-1"></i>刷新</button>
    {% if current_user.role == 'student' %}<button class="btn btn-primary" onclick="window.location.href='/course/selection'"><i class="fas fa-tasks me-1"></i>课程选择</button>{% endif %}</div>
</div>

<div class="card"><div class="card-header"><h5 class="card-title mb-0">{% if current_user.role == 'student' %}我的课表{% else %}我的任课表{% endif %}</h5></div>
<div class="card-body"><div class="table-responsive"><table class="table table-bordered text-center" id="scheduleTable"><thead class="table-light"><tr><th>时间/星期</th><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th><th>周六</th><th>周日</th></tr></thead><tbody id="scheduleTableBody"></tbody></table></div></div></div>

<script>
let scheduleData = [];
let timeSlots = [
    { start:'08:00', end:'08:45', label:'1' }, { start:'08:55', end:'09:40', label:'2' },
    { start:'10:00', end:'10:45', label:'3' }, { start:'10:55', end:'11:40', label:'4' },
    { start:'14:00', end:'14:45', label:'5' }, { start:'14:55', end:'15:40', label:'6' },
    { start:'16:00', end:'16:45', label:'7' }, { start:'16:55', end:'17:40', label:'8' }
];
$(function() {
    loadSchedule();
    $('#refreshScheduleBtn').click(loadSchedule);
});
function loadSchedule() {
    $.get('/course/api/courses/schedule', res => {
        if(res.success) {
            scheduleData = res.data;
            renderSchedule();
        } else { $('#scheduleTableBody').html('<tr><td colspan="8" class="text-center py-4">暂无课程安排</td></tr>'); }
    });
}
function renderSchedule() {
    let tbody = $('#scheduleTableBody');
    tbody.empty();
    for(let ts of timeSlots) {
        let row = `<tr><td class="time-slot">第${ts.label}节<br><small>${ts.start}-${ts.end}</small></td>`;
        for(let day=1; day<=7; day++) {
            let courses = scheduleData.filter(c => c.day_of_week === day && c.start_time >= ts.start && c.start_time < ts.end);
            let cell = '<td class="schedule-cell align-top">';
            courses.forEach(c => {
                cell += `<div class="course-item p-1 mb-1 bg-primary text-white rounded small" data-id="${c.course_id}" title="${c.course_name}\n${c.teacher_name}\n${c.location}">${c.course_name}<br><small>${c.time_display}</small></div>`;
            });
            cell += '</td>';
            row += cell;
        }
        row += '</tr>';
        tbody.append(row);
    }
    $('.course-item').click(function() { viewCourse($(this).data('id')); });
}
function viewCourse(courseId) {
    $.get(`/course/api/courses/${courseId}`, res => {
        if(res.success) showCourseModal(res.data);
    });
}
function showCourseModal(course) {
    let schedules = course.schedules.map(s => `<tr><td>${s.day_of_week_display}</td><td>${s.start_time}</td><td>${s.end_time}</td></tr>`).join('');
    let modalHtml = `<div class="modal fade" id="courseModal"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5>${course.name} (${course.code})</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p><strong>教师:</strong> ${course.teacher_name}</p><p><strong>学分:</strong> ${course.credit} | <strong>学时:</strong> ${course.hours}</p><p><strong>地点:</strong> ${course.location||'未设置'}</p><p><strong>学期:</strong> ${course.semester}</p><p><strong>选课人数:</strong> ${course.current_students}/${course.max_students}</p><p><strong>描述:</strong> ${course.description||'无'}</p><h6>时间安排</h6><table class="table table-sm"><thead><tr><th>星期</th><th>开始</th><th>结束</th></tr></thead><tbody>${schedules}</tbody></table></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button></div></div></div></div>`;
    if($('#courseModal').length) $('#courseModal').remove();
    $('body').append(modalHtml);
    $('#courseModal').modal('show');
}
</script>
<style>
.schedule-cell { min-height: 80px; vertical-align: top; }
.course-item { cursor: pointer; transition: transform 0.1s; }
.course-item:hover { transform: scale(1.02); opacity: 0.9; }
.time-slot { background-color: #f8f9fa; font-weight: bold; }
</style>
{% endblock %}
