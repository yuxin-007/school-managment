{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-tasks me-2"></i>课程选择</h2>
    <div><button class="btn btn-outline-primary" id="refreshSelectionBtn"><i class="fas fa-sync-alt me-1"></i>刷新</button><button class="btn btn-primary" onclick="window.location.href='/course/schedule'"><i class="fas fa-calendar-alt me-1"></i>查看课表</button></div>
</div>
<div class="card mb-4"><div class="card-header"><h5 class="card-title mb-0"><i class="fas fa-list-check me-2"></i>我的选课</h5></div><div class="card-body"><div id="mySelectionsList"></div></div></div>
<div class="card"><div class="card-header"><h5 class="card-title mb-0"><i class="fas fa-book me-2"></i>可选课程 <span id="availableCount" class="text-muted ms-2"></span></h5></div><div class="card-body"><div id="availableCoursesList" class="row"></div></div></div>
<script>
let mySelections = [];
$(function() { loadMySelections(); loadAvailableCourses(); $('#refreshSelectionBtn').click(() => { loadMySelections(); loadAvailableCourses(); }); });
function loadMySelections() { $.get('/course/api/courses/my-selections', res => { if(res.success) { mySelections = res.data; let html = '<div class="row">'; res.data.forEach(s => { html += `<div class="col-md-6 mb-3"><div class="card"><div class="card-body"><h6>${s.course_name}</h6><p class="small text-muted">${s.course_code}</p><p class="small">选课时间: ${s.selected_at}</p><button class="btn btn-sm btn-outline-danger drop-course" data-id="${s.course_id}">退选</button></div></div></div>`; }); html += '</div>'; if(res.data.length===0) html = '<div class="text-center text-muted py-4">暂无选课记录</div>'; $('#mySelectionsList').html(html); $('.drop-course').click(function() { dropCourse($(this).data('id')); }); } }); }
function loadAvailableCourses() { $.get('/course/api/courses', res => { if(res.success) { $('#availableCount').text(`(${res.data.length}门)`); let html = ''; res.data.forEach(c => { let isSelected = mySelections.some(s => s.course_id === c.id); let isFull = c.current_students >= c.max_students; let canSelect = !isSelected && !isFull && c.is_active; html += `<div class="col-md-4 mb-3"><div class="card h-100"><div class="card-body"><h6>${c.name}</h6><p class="small text-muted">${c.code}</p><p><small>${c.teacher_name} | ${c.credit}学分 | ${c.current_students}/${c.max_students}人</small></p><p><small>${c.location||'地点待定'}</small></p>${canSelect ? `<button class="btn btn-sm btn-primary select-course" data-id="${c.id}">选课</button>` : (isSelected ? '<span class="badge bg-info">已选</span>' : (isFull ? '<span class="badge bg-danger">已满</span>' : '<span class="badge bg-secondary">停用</span>'))}</div></div></div>`; }); $('#availableCoursesList').html(html || '<div class="text-center py-4">暂无可选课程</div>'); $('.select-course').click(function() { selectCourse($(this).data('id')); }); } }); }
function selectCourse(courseId) { $.ajax({ url: '/course/api/courses/select', method: 'POST', contentType: 'application/json', data: JSON.stringify({course_id: courseId}), success: res => { if(res.success) { loadMySelections(); loadAvailableCourses(); alert(res.message); } else alert('选课失败: '+res.message); } }); }
function dropCourse(courseId) { $.ajax({ url: '/course/api/courses/drop', method: 'POST', contentType: 'application/json', data: JSON.stringify({course_id: courseId}), success: res => { if(res.success) { loadMySelections(); loadAvailableCourses(); alert(res.message); } else alert('退选失败: '+res.message); } }); }
</script>
{% endblock %}
