{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow">
            <div class="card-body py-5">
                <h1 class="card-title mb-4">🏫 学校管理系统</h1>
                <p class="card-text text-muted mb-4">管理学校学院及人员的请休假和岗位调整</p>
                {% if not current_user.is_authenticated %}
                <div class="mt-4">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg px-4">🔐 登录系统</a>
                    <div class="mt-3"><small class="text-muted">测试账号: admin / admin123</small></div>
                </div>
                {% else %}
                <div class="mt-4">
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-success btn-lg px-4">📊 进入控制台</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
