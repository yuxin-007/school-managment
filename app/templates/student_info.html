{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-user-graduate me-2"></i>学生信息</h2>
    <div>
        <a class="btn btn-outline-secondary" href="{{ url_for('user.statistics') }}">
            <i class="fas fa-arrow-left me-1"></i>返回用户统计
        </a>
        <button class="btn btn-success" onclick="loadStudentByOrg()">
            <i class="fas fa-sync-alt me-1"></i>刷新
        </button>
    </div>
</div>

<!-- Toast -->
<div class="position-fixed top-0 end-0 p-3" style="z-index:1100">
    <div id="appToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- 筛选栏 -->
<div class="card mb-3">
    <div class="card-body py-2">
        <div class="row g-2 align-items-center">
            <div class="col-md-3">
                <input type="text" id="searchKeyword" class="form-control" placeholder="搜索姓名/学号...">
            </div>
            <div class="col-md-2">
                <select id="filterCollege" class="form-select">
                    <option value="">全部学院</option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="filterGrade" class="form-select">
                    <option value="">全部年级</option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="filterStatus" class="form-select">
                    <option value="">全部状态</option>
                    <option value="1">正常</option>
                    <option value="0">禁用</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-success me-1" onclick="applyStudentFilter()">
                    <i class="fas fa-search me-1"></i>筛选
                </button>
                <button class="btn btn-outline-secondary" onclick="resetStudentFilter()">
                    <i class="fas fa-redo me-1"></i>重置
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 总计信息 -->
<div class="alert alert-success mb-3" id="totalAlert" style="display:none">
    <i class="fas fa-info-circle me-1"></i>共 <strong id="totalCount">0</strong> 名学生，当前显示 <strong id="filteredCount">0</strong> 名
</div>

<div id="studentLoading" class="text-center py-5" style="display:none">
    <div class="spinner-border text-success mb-2"></div>
    <p class="text-muted">加载中...</p>
</div>

<div id="studentContent"></div>

<!-- 编辑学生模态框 -->
<div class="modal fade" id="editStudentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑学生</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editStudentForm">
                <div class="modal-body">
                    <input type="hidden" id="editStudentId">
                    <div class="mb-3"><label>学号</label><input type="text" class="form-control" id="editStudentNum" readonly></div>
                    <div class="mb-3"><label>真实姓名 *</label><input type="text" class="form-control" id="editRealName" required></div>
                    <div class="mb-3"><label>年级</label><input type="text" class="form-control" id="editGrade" placeholder="如：2024级"></div>
                    <div class="mb-3"><label>专业</label><input type="text" class="form-control" id="editMajor" placeholder="如：计算机科学与技术"></div>
                    <div class="mb-3"><label>邮箱</label><input type="email" class="form-control" id="editEmail"></div>
                    <div class="mb-3"><label>手机号</label><input type="tel" class="form-control" id="editPhone"></div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="editIsActive">
                        <label class="form-check-label" for="editIsActive">账户启用</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let studentData = null;  // 缓存数据

function showToast(msg, type) {
    const toast = document.getElementById('appToast');
    const toastMsg = document.getElementById('toastMsg');
    toast.className = 'toast align-items-center text-white border-0 bg-' + (type || 'success');
    toastMsg.textContent = msg;
    new bootstrap.Toast(toast, {delay: 3000}).show();
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

$(function() {
    loadStudentByOrg();
    $('#editStudentForm').submit(function(e) {
        e.preventDefault();
        saveEditStudent();
    });
    // 回车搜索
    $('#searchKeyword').on('keyup', function(e) {
        if (e.key === 'Enter') applyStudentFilter();
    });
});

function loadStudentByOrg() {
    $('#studentLoading').show();
    $('#studentContent').empty();
    $('#totalAlert').hide();

    $.get('/user/api/users/student-by-org', res => {
        $('#studentLoading').hide();
        if (!res.success) {
            showToast('加载学生信息失败', 'danger');
            return;
        }
        studentData = res.data;
        $('#totalCount').text(studentData.total);
        $('#totalAlert').show();

        // 填充学院和年级下拉框
        const collegeSelect = $('#filterCollege');
        const gradeSelect = $('#filterGrade');
        const gradeSet = new Set();

        collegeSelect.find('option:not(:first)').remove();
        studentData.colleges.forEach(c => {
            collegeSelect.append(`<option value="${c.college_id}">${escHtml(c.college_name)}</option>`);
            c.sub_groups.forEach(sg => {
                sg.students.forEach(s => {
                    if (s.grade) gradeSet.add(s.grade);
                });
            });
        });

        gradeSelect.find('option:not(:first)').remove();
        Array.from(gradeSet).sort().forEach(g => {
            gradeSelect.append(`<option value="${escHtml(g)}">${escHtml(g)}</option>`);
        });

        applyStudentFilter();
    }).fail(() => {
        $('#studentLoading').hide();
        showToast('加载学生信息失败', 'danger');
    });
}

function applyStudentFilter() {
    if (!studentData) return;

    const keyword = $('#searchKeyword').val().toLowerCase().trim();
    const collegeId = $('#filterCollege').val();
    const grade = $('#filterGrade').val();
    const status = $('#filterStatus').val();

    let totalFiltered = 0;
    let html = '';

    // 按学院分组筛选
    studentData.colleges.forEach(c => {
        // 筛选学院
        if (collegeId && String(c.college_id) !== collegeId) return;

        let hasVisibleStudents = false;
        let collegeHtml = `
<div class="card mb-4 border-success">
    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
        <strong><i class="fas fa-graduation-cap me-2"></i>${escHtml(c.college_name)}</strong>
        <span class="badge bg-light text-success">${c.total} 人</span>
    </div>
    <div class="card-body p-0">`;
        let groupCount = 0;
        let collegeFiltered = 0;

        c.sub_groups.forEach(sg => {
            const filteredStudents = sg.students.filter(s => {
                if (keyword && !s.real_name.toLowerCase().includes(keyword) && !s.number.toLowerCase().includes(keyword)) return false;
                if (grade && s.grade !== grade) return false;
                if (status && String(s.is_active) !== status) return false;
                return true;
            });

            if (filteredStudents.length > 0) {
                hasVisibleStudents = true;
                groupCount++;
                collegeFiltered += filteredStudents.length;
                totalFiltered += filteredStudents.length;

                collegeHtml += `
        <div class="px-3 py-2 bg-light border-bottom d-flex justify-content-between align-items-center">
            <strong class="text-success"><i class="fas fa-layer-group me-1"></i>${escHtml(sg.group_name)}</strong>
            <span class="badge bg-secondary">${filteredStudents.length} / ${sg.count} 人</span>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm mb-0">
                <thead class="table-light">
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>年级</th>
                        <th>专业</th>
                        <th>邮箱</th>
                        <th>手机号</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>`;
                filteredStudents.forEach(s => {
                    collegeHtml += `<tr>
                        <td><span class="badge bg-info">${escHtml(s.number)}</span></td>
                        <td><strong>${escHtml(s.real_name)}</strong></td>
                        <td>${escHtml(s.grade)}</td>
                        <td>${escHtml(s.major)}</td>
                        <td>${escHtml(s.email)}</td>
                        <td>${escHtml(s.phone)}</td>
                        <td><span class="badge ${s.is_active ? 'bg-success' : 'bg-danger'}">${s.is_active ? '正常' : '禁用'}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-info" onclick="openEditModal(${s.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>`;
                });
                collegeHtml += `</tbody></table></div>`;
            }
        });

        if (hasVisibleStudents) {
            // 更新卡片头部显示筛选后的数量
            collegeHtml = collegeHtml.replace(
                /<span class="badge bg-light text-success">(\d+) 人<\/span>/,
                `<span class="badge bg-light text-success">${collegeFiltered} / ${c.total} 人</span>`
            );
            collegeHtml += `</div></div>`;
            html += collegeHtml;
        }
    });

    // 未分配的学生
    if (!collegeId) {
        const filteredUnassigned = studentData.unassigned.filter(s => {
            if (keyword && !s.real_name.toLowerCase().includes(keyword) && !s.number.toLowerCase().includes(keyword)) return false;
            if (grade && s.grade !== grade) return false;
            if (status && String(s.is_active) !== status) return false;
            return true;
        });

        if (filteredUnassigned.length > 0) {
            totalFiltered += filteredUnassigned.length;
            html += `
<div class="card mb-4 border-secondary">
    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
        <strong><i class="fas fa-question-circle me-2"></i>未分配组织</strong>
        <span class="badge bg-light text-secondary">${filteredUnassigned.length} / ${studentData.unassigned.length} 人</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>年级</th>
                        <th>专业</th>
                        <th>邮箱</th>
                        <th>手机号</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>`;
            filteredUnassigned.forEach(s => {
                html += `<tr>
                    <td><span class="badge bg-info">${escHtml(s.number)}</span></td>
                    <td><strong>${escHtml(s.real_name)}</strong></td>
                    <td>${escHtml(s.grade)}</td>
                    <td>${escHtml(s.major)}</td>
                    <td>${escHtml(s.email)}</td>
                    <td>${escHtml(s.phone)}</td>
                    <td><span class="badge ${s.is_active ? 'bg-success' : 'bg-danger'}">${s.is_active ? '正常' : '禁用'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-info" onclick="openEditModal(${s.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table></div></div></div>`;
        }
    }

    $('#filteredCount').text(totalFiltered);

    if (!html) {
        html = `<div class="text-center text-muted py-5">
            <i class="fas fa-search fa-3x mb-3"></i>
            <p>没有找到符合条件的学生</p>
        </div>`;
    }

    $('#studentContent').html(html);
}

function resetStudentFilter() {
    $('#searchKeyword').val('');
    $('#filterCollege').val('');
    $('#filterGrade').val('');
    $('#filterStatus').val('');
    applyStudentFilter();
}

// 打开编辑弹窗
function openEditModal(userId) {
    $.get('/user/api/users/' + userId, res => {
        if (!res.success) {
            showToast('获取学生信息失败', 'danger');
            return;
        }
        let u = res.data;
        $('#editStudentId').val(u.id);
        $('#editStudentNum').val(u.student_id || '');
        $('#editRealName').val(u.real_name || '');
        $('#editGrade').val(u.grade || '');
        $('#editMajor').val(u.major || '');
        $('#editEmail').val(u.email || '');
        $('#editPhone').val(u.phone || '');
        $('#editIsActive').prop('checked', u.is_active);
        new bootstrap.Modal(document.getElementById('editStudentModal')).show();
    });
}

// 保存编辑
function saveEditStudent() {
    let id = $('#editStudentId').val();
    let data = {
        real_name: $('#editRealName').val(),
        grade: $('#editGrade').val(),
        major: $('#editMajor').val(),
        email: $('#editEmail').val(),
        phone: $('#editPhone').val(),
        is_active: $('#editIsActive').is(':checked')
    };
    $.ajax({
        url: '/user/api/users/' + id,
        method: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: res => {
            if (res.success) {
                bootstrap.Modal.getInstance(document.getElementById('editStudentModal')).hide();
                loadStudentByOrg();
                showToast('学生信息已更新', 'success');
            } else {
                showToast('错误: ' + res.message, 'danger');
            }
        },
        error: () => showToast('请求失败', 'danger')
    });
}
</script>
{% endblock %}
