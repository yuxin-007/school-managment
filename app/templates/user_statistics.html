{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-chart-bar me-2"></i>用户统计与管理</h2>
    <div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal"><i class="fas fa-user-plus me-1"></i>添加用户</button>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#importUsersModal"><i class="fas fa-file-import me-1"></i>导入</button>
        <button class="btn btn-info" id="exportUsersBtn"><i class="fas fa-file-export me-1"></i>导出</button>
        <button class="btn btn-outline-primary" id="refreshStatsBtn"><i class="fas fa-sync-alt me-1"></i>刷新</button>
    </div>
</div>

<!-- Toast 通知 -->
<div class="position-fixed top-0 end-0 p-3" style="z-index:1100">
    <div id="appToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<div class="row mb-4">
    <div class="col-xl-3 col-md-6 mb-3"><div class="card bg-primary text-white"><div class="card-body"><h4 id="totalUsers">0</h4><p>总用户数</p></div></div></div>
    <div class="col-xl-3 col-md-6 mb-3"><div class="card bg-success text-white"><div class="card-body"><h4 id="activeUsers">0</h4><p>活跃用户</p></div></div></div>
    <div class="col-xl-3 col-md-6 mb-3"><div class="card bg-info text-white"><div class="card-body"><h4 id="recentUsers">0</h4><p>本月新增</p></div></div></div>
    <div class="col-xl-3 col-md-6 mb-3"><div class="card bg-warning text-white"><div class="card-body"><h4 id="noPrimaryUsers">0</h4><p>未分配主节点</p></div></div></div>
</div>

<!-- 教师/学生信息按钮 -->
<div class="row mb-4">
    <div class="col-md-4 mb-2">
        <a class="btn btn-outline-primary w-100 py-3" href="{{ url_for('user.staff_info') }}">
            <i class="fas fa-chalkboard-teacher me-2"></i><strong>教师信息</strong><br><small class="text-muted">按学院分类查看</small>
        </a>
    </div>
    <div class="col-md-4 mb-2">
        <a class="btn btn-outline-success w-100 py-3" href="{{ url_for('user.student_info') }}">
            <i class="fas fa-user-graduate me-2"></i><strong>学生信息</strong><br><small class="text-muted">按学院-年级-专业分类查看</small>
        </a>
    </div>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">用户列表</h5>
        <small class="text-muted">共 <span id="totalCount">0</span> 条，第 <span id="currentPage">1</span>/<span id="totalPages">1</span> 页</small>
    </div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-4"><input type="text" id="searchKeyword" class="form-control" placeholder="姓名/学号/工号"></div>
            <div class="col-md-3">
                <select id="searchRole" class="form-control">
                    <option value="">全部角色</option>
                    <option value="college_admin">学院管理员</option>
                    <option value="staff">教职工</option>
                    <option value="student">学生</option>
                </select>
            </div>
            <div class="col-md-3">
                <button id="searchBtn" class="btn btn-primary">搜索</button>
                <button id="resetSearchBtn" class="btn btn-outline-secondary">重置</button>
            </div>
        </div>
        <div class="alert alert-info mb-3">
            <i class="fas fa-info-circle me-1"></i>
            <strong>系统管理员</strong>作为系统最高管理员，无法在此页面进行编辑、删除或角色变更操作。
        </div>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>学号/工号</th><th>姓名</th><th>角色</th><th>邮箱</th><th>手机号</th><th>部门</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>
        <!-- 分页 -->
        <nav id="paginationNav" class="d-flex justify-content-center mt-3" style="display:none!important"></nav>
    </div>
</div>


<!-- 添加用户模态框 -->
<div class="modal fade" id="addUserModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">添加用户</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="addUserForm"><div class="modal-body">
        <div class="mb-3"><label>用户名 *</label><input type="text" class="form-control" id="addUsername" required></div>
        <div class="mb-3"><label>密码 *</label><input type="password" class="form-control" id="addPassword" required></div>
        <div class="mb-3"><label>真实姓名 *</label><input type="text" class="form-control" id="addRealName" required></div>
        <div class="mb-3"><label>邮箱</label><input type="email" class="form-control" id="addEmail"></div>
        <div class="mb-3"><label>手机号</label><input type="tel" class="form-control" id="addPhone"></div>
        <div class="mb-3"><label>角色 *</label>
            <select class="form-control" id="addRole" required>
                <option value="">请选择</option>
                <option value="college_admin">学院管理员</option>
                <option value="staff">教职工</option>
                <option value="student">学生</option>
            </select>
            <div class="form-text text-muted"><i class="fas fa-lock me-1"></i>系统管理员由系统创建，此处不可添加</div>
        </div>
        <div class="mb-3"><label>职位/身份</label><input type="text" class="form-control" id="addPosition"></div>
        <div class="mb-3"><label>工号/学号</label><input type="text" class="form-control" id="addEmployeeId"></div>
    </div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-primary">添加</button></div></form>
</div></div></div>

<!-- 编辑用户模态框 -->
<div class="modal fade" id="editUserModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="editModalTitle">编辑用户</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <form id="editUserForm"><div class="modal-body">
        <input type="hidden" id="editUserId">
        <input type="hidden" id="editIsSuperAdmin">
        <div class="mb-3"><label>用户名</label><input type="text" class="form-control" id="editUsername" readonly></div>
        <div class="mb-3"><label>真实姓名 *</label><input type="text" class="form-control" id="editRealName" required></div>
        <div class="mb-3"><label>邮箱</label><input type="email" class="form-control" id="editEmail"></div>
        <div class="mb-3"><label>手机号</label><input type="tel" class="form-control" id="editPhone"></div>
        <div class="mb-3" id="editRoleWrapper">
            <label>角色 *</label>
            <select class="form-control" id="editRole" required>
                <option value="college_admin">学院管理员</option>
                <option value="staff">教职工</option>
                <option value="student">学生</option>
            </select>
        </div>
        <div class="mb-3"><label>职位/身份</label><input type="text" class="form-control" id="editPosition"></div>
        <div class="mb-3"><label>工号/学号</label><input type="text" class="form-control" id="editEmployeeId"></div>
        <div class="mb-3 form-check" id="editActiveWrapper">
            <input type="checkbox" class="form-check-input" id="editIsActive">
            <label class="form-check-label" for="editIsActive">账户启用</label>
        </div>
        <div class="alert alert-warning" id="editSuperAdminWarning" style="display:none;">
            <i class="fas fa-exclamation-triangle me-1"></i>
            <strong>系统管理员</strong>的账户信息和角色无法修改。
        </div>
    </div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-primary" id="editSubmitBtn">保存</button></div></form>
</div></div></div>

<!-- 导入模态框 -->
<div class="modal fade" id="importUsersModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">批量导入</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><p><a href="/user/api/users/template" class="btn btn-sm btn-success">下载模板</a></p><form id="importForm" enctype="multipart/form-data"><input type="file" name="file" class="form-control" accept=".xlsx,.xls,.csv" required></form></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="button" id="startImportBtn" class="btn btn-primary">开始导入</button></div>
</div></div></div>

<script>
let currentPage = 1;
let isSearchMode = false;

function showToast(msg, type) {
    const toast = document.getElementById('appToast');
    const toastMsg = document.getElementById('toastMsg');
    toast.className = 'toast align-items-center text-white border-0 bg-' + (type || 'success');
    toastMsg.textContent = msg;
    new bootstrap.Toast(toast, {delay: 3000}).show();
}

$(function() {
    loadStats();
    loadUsers(1);
    $('#refreshStatsBtn').click(() => { loadStats(); loadUsers(currentPage); });
    $('#searchBtn').click(() => { isSearchMode = true; searchUsers(); });
    $('#searchKeyword').keypress(e => { if(e.which === 13) { isSearchMode = true; searchUsers(); } });
    $('#resetSearchBtn').click(() => {
        $('#searchKeyword').val(''); $('#searchRole').val('');
        isSearchMode = false;
        loadUsers(1);
    });
    $('#addUserForm').submit(function(e) { e.preventDefault(); addUser(); });
    $('#editUserForm').submit(function(e) { e.preventDefault(); saveEditUser(); });
    $('#exportUsersBtn').click(() => window.location.href='/user/api/users/export?format=excel');
    $('#startImportBtn').click(() => {
        let fd = new FormData($('#importForm')[0]);
        $.ajax({ url: '/user/api/users/import', method: 'POST', data: fd, processData: false, contentType: false,
            success: res => { showToast(res.message, res.success ? 'success' : 'danger'); if(res.success) { loadUsers(1); loadStats(); } },
            error: () => showToast('导入失败', 'danger')
        });
    });
});

function loadStats() {
    $.get('/user/api/statistics/users', res => {
        if(res.success) {
            $('#totalUsers').text(res.data.total_users);
            $('#activeUsers').text(res.data.status_distribution.active);
            $('#recentUsers').text(res.data.recent_users);
            $('#noPrimaryUsers').text(res.data.users_without_primary);
        }
    });
}

function loadUsers(page) {
    currentPage = page || 1;
    $.get('/user/api/users?page=' + currentPage + '&per_page=20', res => {
        if(res.success) {
            displayUsers(res.data);
            if(res.pagination) {
                $('#totalCount').text(res.pagination.total);
                $('#currentPage').text(res.pagination.page);
                $('#totalPages').text(res.pagination.pages);
                renderPagination(res.pagination);
            }
        }
    });
}

function renderPagination(p) {
    if(p.pages <= 1) { $('#paginationNav').hide(); return; }
    $('#paginationNav').show();
    let html = '<ul class="pagination">';
    html += `<li class="page-item ${!p.has_prev ? 'disabled' : ''}"><a class="page-link" href="#" onclick="loadUsers(${p.page - 1});return false;">上一页</a></li>`;
    let start = Math.max(1, p.page - 2), end = Math.min(p.pages, p.page + 2);
    for(let i = start; i <= end; i++) {
        html += `<li class="page-item ${i === p.page ? 'active' : ''}"><a class="page-link" href="#" onclick="loadUsers(${i});return false;">${i}</a></li>`;
    }
    html += `<li class="page-item ${!p.has_next ? 'disabled' : ''}"><a class="page-link" href="#" onclick="loadUsers(${p.page + 1});return false;">下一页</a></li>`;
    html += '</ul>';
    $('#paginationNav').html(html);
}

function displayUsers(users) {
    let tbody = $('#usersTableBody');
    tbody.empty();
    if(!users.length) { tbody.append('<tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>'); return; }
    users.forEach(u => {
        // 根据角色决定显示学号还是工号
        let numberDisplay = u.student_id || u.employee_id || '-';
        let numberLabel = u.role === 'student' ? '学号' : '工号';

        // 系统管理员特殊处理
        let isSuperAdmin = u.role === 'super_admin';
        let actions = '';
        if (isSuperAdmin) {
            actions = `<span class="badge bg-warning text-dark"><i class="fas fa-crown me-1"></i>系统管理员</span>`;
        } else {
            actions = `
                <button class="btn btn-sm btn-outline-info edit-user" data-user='${JSON.stringify(u)}'><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm btn-outline-danger delete-user" data-id="${u.id}" data-name="${escHtml(u.username)}"><i class="fas fa-trash"></i></button>
            `;
        }
        tbody.append(`<tr>
            <td><span class="badge bg-secondary">${numberLabel}</span> ${escHtml(numberDisplay)}</td>
            <td>${escHtml(u.real_name)}</td>
            <td>${escHtml(u.role_display)}</td>
            <td>${escHtml(u.email || '-')}</td>
            <td>${escHtml(u.phone || '-')}</td>
            <td>${escHtml(u.department_name || '-')}</td>
            <td><span class="badge ${u.is_active ? 'bg-success' : 'bg-danger'}">${u.is_active ? '正常' : '禁用'}</span></td>
            <td>${actions}</td>
        </tr>`);
    });
    $('.edit-user').click(function() { openEditModal(JSON.parse($(this).attr('data-user'))); });
    $('.delete-user').click(function() {
        if(confirm('确定删除用户「' + $(this).data('name') + '」？')) deleteUser($(this).data('id'));
    });
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openEditModal(u) {
    $('#editUserId').val(u.id);
    $('#editUsername').val(u.username);
    $('#editRealName').val(u.real_name);
    $('#editEmail').val(u.email || '');
    $('#editPhone').val(u.phone || '');
    $('#editPosition').val(u.position || '');
    $('#editEmployeeId').val(u.employee_id || '');

    // 系统管理员特殊处理
    let isSuperAdmin = u.role === 'super_admin';
    $('#editIsSuperAdmin').val(isSuperAdmin);

    if (isSuperAdmin) {
        $('#editModalTitle').text('查看用户详情');
        $('#editRealName').prop('readonly', true);
        $('#editEmail').prop('readonly', true);
        $('#editPhone').prop('readonly', true);
        $('#editPosition').prop('readonly', true);
        $('#editEmployeeId').prop('readonly', true);
        $('#editRoleWrapper').hide();
        $('#editActiveWrapper').hide();
        $('#editSubmitBtn').hide();
        $('#editSuperAdminWarning').show();
    } else {
        $('#editModalTitle').text('编辑用户');
        $('#editRealName').prop('readonly', false);
        $('#editEmail').prop('readonly', false);
        $('#editPhone').prop('readonly', false);
        $('#editPosition').prop('readonly', false);
        $('#editEmployeeId').prop('readonly', false);
        $('#editRoleWrapper').show();
        $('#editActiveWrapper').show();
        $('#editSubmitBtn').show();
        $('#editSuperAdminWarning').hide();
        $('#editRole').val(u.role);
        $('#editIsActive').prop('checked', u.is_active);
    }

    new bootstrap.Modal(document.getElementById('editUserModal')).show();
}

function saveEditUser() {
    // 系统管理员不允许修改
    if ($('#editIsSuperAdmin').val() === 'true') {
        showToast('系统管理员不可修改', 'warning');
        return;
    }

    let id = $('#editUserId').val();
    let data = {
        real_name: $('#editRealName').val(),
        email: $('#editEmail').val(),
        phone: $('#editPhone').val(),
        role: $('#editRole').val(),
        position: $('#editPosition').val(),
        employee_id: $('#editEmployeeId').val(),
        is_active: $('#editIsActive').is(':checked')
    };
    $.ajax({ url: '/user/api/users/' + id, method: 'PUT', contentType: 'application/json', data: JSON.stringify(data),
        success: res => {
            if(res.success) {
                bootstrap.Modal.getInstance(document.getElementById('editUserModal')).hide();
                loadUsers(currentPage);
                showToast('用户已更新', 'success');
            } else {
                showToast('错误: ' + res.message, 'danger');
            }
        },
        error: () => showToast('请求失败', 'danger')
    });
}

function searchUsers() {
    let keyword = $('#searchKeyword').val();
    let role = $('#searchRole').val();
    $.get('/user/api/users/search?keyword=' + encodeURIComponent(keyword) + '&role=' + role, res => {
        if(res.success) {
            displayUsers(res.data);
            $('#totalCount').text(res.data.length);
            $('#paginationNav').hide();
        }
    });
}

function addUser() {
    let data = {
        username: $('#addUsername').val(), password: $('#addPassword').val(),
        real_name: $('#addRealName').val(), email: $('#addEmail').val(),
        phone: $('#addPhone').val(), role: $('#addRole').val(),
        position: $('#addPosition').val(), employee_id: $('#addEmployeeId').val()
    };
    $.ajax({ url: '/user/api/users', method: 'POST', contentType: 'application/json', data: JSON.stringify(data),
        success: res => {
            if(res.success) {
                bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
                $('#addUserForm')[0].reset();
                loadUsers(1); loadStats();
                showToast('用户添加成功', 'success');
            } else {
                showToast('错误: ' + res.message, 'danger');
            }
        }
    });
}

function deleteUser(id) {
    $.ajax({ url: '/user/api/users/' + id, method: 'DELETE',
        success: res => {
            if(res.success) { loadUsers(currentPage); loadStats(); showToast('删除成功', 'success'); }
            else showToast('错误: ' + res.message, 'danger');
        }
    });
}


</script>
{% endblock %}
