{% extends "base.html" %}

{% block title %}我的通知 - 学校管理系统{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-bell me-2"></i>我的通知</h2>
            <button class="btn btn-outline-primary btn-sm" onclick="markAllRead()">
                <i class="fas fa-check-double me-1"></i>全部标记为已读
            </button>
        </div>

        <!-- 筛选 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="btn-group" role="group">
                    <button class="btn btn-outline-primary active" data-filter="all" onclick="setFilter('all')">全部</button>
                    <button class="btn btn-outline-primary" data-filter="unread" onclick="setFilter('unread')">未读</button>
                    <button class="btn btn-outline-primary" data-filter="read" onclick="setFilter('read')">已读</button>
                </div>
            </div>
        </div>

        <!-- 通知列表 -->
        <div class="card">
            <div class="card-body">
                <div id="notificationList"></div>
                <nav>
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let currentFilter = 'all';

$(function() {
    loadNotifications();
});

function setFilter(filter) {
    currentFilter = filter;
    currentPage = 1;
    $('.btn-group .btn').removeClass('active');
    $(`.btn-group .btn[data-filter="${filter}"]`).addClass('active');
    loadNotifications();
}

function loadNotifications(page = 1) {
    currentPage = page;
    const isRead = currentFilter === 'all' ? '' : (currentFilter === 'unread' ? 'false' : 'true');

    $.get('/notification/api/notifications', {
        page: page,
        per_page: 20,
        is_read: isRead
    }, function(res) {
        if (res.success) {
            renderNotifications(res.data);
            renderPagination(res.pagination);
        }
    });
}

function renderNotifications(notifications) {
    const container = $('#notificationList');
    container.empty();

    if (notifications.length === 0) {
        container.html('<div class="text-center text-muted py-5"><i class="fas fa-bell-slash fa-3x mb-3"></i><p>暂无通知</p></div>');
        return;
    }

    notifications.forEach(function(notif) {
        const unreadClass = notif.is_read ? '' : 'border-primary';
        const unreadBg = notif.is_read ? '' : 'bg-light';
        const unreadIcon = notif.is_read ? '' : '<span class="badge bg-danger rounded-circle" style="width:8px;height:8px;"></span>';

        const typeIcon = {
            'leave_approved': 'fa-check-circle text-success',
            'leave_rejected': 'fa-times-circle text-danger',
            'course_change': 'fa-exchange-alt text-info',
            'grade_published': 'fa-graduation-cap text-warning',
            'announcement': 'fa-bullhorn text-primary',
            'system': 'fa-cog text-secondary'
        }[notif.notification_type] || 'fa-bell text-secondary';

        container.append(`
            <div class="notification-item border rounded p-3 mb-2 ${unreadClass} ${unreadBg}">
                <div class="d-flex align-items-start">
                    <div class="me-3 mt-1">
                        <i class="fas ${typeIcon} fa-lg"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <strong>${escHtml(notif.title)}</strong>
                            ${unreadIcon}
                        </div>
                        <p class="mb-1 text-muted">${escHtml(notif.content || '')}</p>
                        <small class="text-muted">${notif.created_at}</small>
                    </div>
                    <div class="ms-3">
                        ${notif.is_read ? '' : `<button class="btn btn-sm btn-outline-secondary" onclick="markRead(${notif.id})">标为已读</button>`}
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteNotification(${notif.id})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>
        `);
    });
}

function markRead(id) {
    $.post('/notification/api/notifications/' + id + '/read', function(res) {
        if (res.success) {
            loadNotifications(currentPage);
            updateUnreadCount();
        }
    });
}

function markAllRead() {
    $.post('/notification/api/notifications/read-all', function(res) {
        if (res.success) {
            loadNotifications(currentPage);
            updateUnreadCount();
        }
    });
}

function deleteNotification(id) {
    if (!confirm('确定要删除这条通知吗？')) return;
    $.ajax({url: '/notification/api/notifications/' + id, method: 'DELETE',
        success: function(res) {
            if (res.success) {
                loadNotifications(currentPage);
                updateUnreadCount();
            }
        }
    });
}

function updateUnreadCount() {
    fetch('{{ url_for("notification.get_unread_count") }}')
        .then(r => r.json())
        .then(data => {
            const badge = parent.document.getElementById('unreadBadge') || document.getElementById('unreadBadge');
            if (badge) {
                if (data.success && data.data.unread > 0) {
                    badge.textContent = data.data.unread > 99 ? '99+' : data.data.unread;
                    badge.style.display = 'inline-block';
                } else if (badge) {
                    badge.style.display = 'none';
                }
            }
        });
}

function renderPagination(pagination) {
    const ul = $('#pagination');
    ul.empty();
    if (pagination.pages <= 1) return;
    ul.append(`<li class="page-item ${pagination.has_prev ? '' : 'disabled'}"><a class="page-link" href="#" onclick="loadNotifications(${pagination.page - 1})">上一页</a></li>`);
    for (let i = 1; i <= pagination.pages; i++) {
        if (i === 1 || i === pagination.pages || (i >= pagination.page - 2 && i <= pagination.page + 2)) {
            ul.append(`<li class="page-item ${i === pagination.page ? 'active' : ''}"><a class="page-link" href="#" onclick="loadNotifications(${i})">${i}</a></li>`);
        }
    }
    ul.append(`<li class="page-item ${pagination.has_next ? '' : 'disabled'}"><a class="page-link" href="#" onclick="loadNotifications(${pagination.page + 1})">下一页</a></li>`);
}

function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>

<style>
.notification-item { transition: all 0.2s; cursor: pointer; }
.notification-item:hover { background-color: #f8f9fa; }
</style>
{% endblock %}
