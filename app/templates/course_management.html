{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-book me-2"></i>课程管理</h2>
    <div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCourseModal"><i class="fas fa-plus me-1"></i>添加课程</button><button class="btn btn-outline-secondary" id="refreshCoursesBtn"><i class="fas fa-sync-alt me-1"></i>刷新</button></div>
</div>
<div class="card"><div class="card-header"><h5 class="card-title mb-0">课程列表</h5></div><div class="card-body"><div class="table-responsive"><table class="table table-striped"><thead><tr><th>代码</th><th>名称</th><th>教师</th><th>学分</th><th>选课人数</th><th>学期</th><th>状态</th><th>操作</th></tr></thead><tbody id="coursesTableBody"></tbody></table></div></div></div>

<div class="modal fade" id="addCourseModal"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">添加课程</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form id="addCourseForm"><div class="modal-body"><div class="row"><div class="col-md-6"><div class="mb-3"><label>课程名称 *</label><input type="text" class="form-control" id="courseName" required></div></div><div class="col-md-6"><div class="mb-3"><label>课程代码 *</label><input type="text" class="form-control" id="courseCode" required></div></div></div><div class="row"><div class="col-md-6"><div class="mb-3"><label>学分</label><input type="number" class="form-control" id="courseCredit" step="0.5"></div></div><div class="col-md-6"><div class="mb-3"><label>学时</label><input type="number" class="form-control" id="courseHours"></div></div></div><div class="row"><div class="col-md-6"><div class="mb-3"><label>学期 *</label><select class="form-control" id="courseSemester" required><option value="2024-春">2024-春</option><option value="2024-秋">2024-秋</option></select></div></div><div class="col-md-6"><div class="mb-3"><label>上课地点</label><input type="text" class="form-control" id="courseLocation"></div></div></div><div class="mb-3"><label>描述</label><textarea class="form-control" id="courseDescription" rows="2"></textarea></div><div class="mb-3"><label>最大选课人数</label><input type="number" class="form-control" id="courseMaxStudents" value="30"></div><div class="card"><div class="card-header">时间安排</div><div class="card-body"><div id="schedulesContainer"></div><button type="button" class="btn btn-sm btn-outline-primary" id="addScheduleBtn"><i class="fas fa-plus"></i> 添加</button></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-primary">添加</button></div></form></div></div></div>

<script>
function addScheduleRow(day=1, start='08:00', end='09:40') { let id = Date.now(); let html = `<div class="schedule-row row g-2 mb-2" id="sch_${id}"><div class="col-md-4"><select class="form-control form-control-sm day-select"><option value="1" ${day==1?'selected':''}>周一</option><option value="2" ${day==2?'selected':''}>周二</option><option value="3" ${day==3?'selected':''}>周三</option><option value="4" ${day==4?'selected':''}>周四</option><option value="5" ${day==5?'selected':''}>周五</option></select></div><div class="col-md-3"><input type="time" class="form-control form-control-sm start-time" value="${start}"></div><div class="col-md-3"><input type="time" class="form-control form-control-sm end-time" value="${end}"></div><div class="col-md-2"><button type="button" class="btn btn-sm btn-outline-danger remove-schedule" data-id="${id}"><i class="fas fa-times"></i></button></div></div>`; $('#schedulesContainer').append(html); $(`.remove-schedule[data-id="${id}"]`).click(function() { $(`#sch_${id}`).remove(); }); }
$(function() { loadCourses(); $('#refreshCoursesBtn').click(loadCourses); $('#addScheduleBtn').click(() => addScheduleRow()); $('#addCourseForm').submit(function(e) { e.preventDefault(); addCourse(); }); });
function loadCourses() { $.get('/course/api/courses', res => { if(res.success) { let tbody = $('#coursesTableBody'); tbody.empty(); res.data.forEach(c => { tbody.append(`<tr><td>${c.code}</td><td>${c.name}</td><td>${c.teacher_name}</td><td>${c.credit}</td><td>${c.current_students}/${c.max_students}</span></td><td>${c.semester}</td><td><span class="badge ${c.is_active?'bg-success':'bg-danger'}">${c.is_active?'启用':'停用'}</span></td><td><button class="btn btn-sm btn-outline-info edit-course" data-id="${c.id}"><i class="fas fa-edit"></i></button> <button class="btn btn-sm btn-outline-danger delete-course" data-id="${c.id}"><i class="fas fa-trash"></i></button></td></tr>`); }); $('.edit-course').click(function() { alert('编辑功能开发中'); }); $('.delete-course').click(function() { if(confirm('删除课程？')) deleteCourse($(this).data('id')); }); } }); }
function addCourse() { let schedules = []; $('.schedule-row').each(function() { schedules.push({ day_of_week: $(this).find('.day-select').val(), start_time: $(this).find('.start-time').val(), end_time: $(this).find('.end-time').val() }); }); let data = { name: $('#courseName').val(), code: $('#courseCode').val(), credit: $('#courseCredit').val(), hours: $('#courseHours').val(), semester: $('#courseSemester').val(), location: $('#courseLocation').val(), description: $('#courseDescription').val(), max_students: $('#courseMaxStudents').val(), schedules: schedules }; $.ajax({ url: '/course/api/courses', method: 'POST', contentType: 'application/json', data: JSON.stringify(data), success: res => { if(res.success) { $('#addCourseModal').modal('hide'); loadCourses(); alert(res.message); } else alert('错误: '+res.message); } }); }
function deleteCourse(id) { $.ajax({ url: `/course/api/courses/${id}`, method: 'DELETE', success: res => { if(res.success) { loadCourses(); alert('删除成功'); } else alert('错误: '+res.message); } }); }
</script>
{% endblock %}
