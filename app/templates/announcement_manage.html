{% extends "base.html" %}

{% block title %}公告管理 - 学校管理系统{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-cog me-2"></i>公告管理</h2>
            <button class="btn btn-primary" onclick="showCreateModal()">
                <i class="fas fa-plus me-1"></i>发布公告
            </button>
        </div>

        <!-- 公告列表 -->
        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>标题</th>
                            <th>类型</th>
                            <th>优先级</th>
                            <th>状态</th>
                            <th>发布者</th>
                            <th>发布时间</th>
                            <th>浏览</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="announcementTable"></tbody>
                </table>
                <nav>
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- 创建/编辑 Modal -->
<div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="formTitle">发布公告</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label">标题 *</label>
                    <input type="text" class="form-control" id="annTitle" required>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">类型</label>
                        <select class="form-select" id="annCategory">
                            <option value="general">普通</option>
                            <option value="system">系统通知</option>
                            <option value="course">课程通知</option>
                            <option value="leave">请假通知</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">优先级</label>
                        <select class="form-select" id="annPriority">
                            <option value="normal">普通</option>
                            <option value="important">重要</option>
                            <option value="urgent">紧急</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="annActive">
                            <option value="true">发布</option>
                            <option value="false">草稿</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">生效日期</label>
                        <input type="date" class="form-control" id="annStartDate">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">失效日期</label>
                        <input type="date" class="form-control" id="annEndDate">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">置顶</label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="annPinned">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">内容 *</label>
                    <textarea class="form-control" id="annContent" rows="8" required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveAnnouncement()">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

$(function() {
    loadAnnouncements();
});

function loadAnnouncements(page = 1) {
    currentPage = page;
    $.get('/announcement/api/announcements/all', {page: page, per_page: 20}, function(res) {
        if (res.success) {
            renderTable(res.data);
            renderPagination(res.pagination);
        }
    });
}

function renderTable(announcements) {
    const tbody = $('#announcementTable');
    tbody.empty();

    if (announcements.length === 0) {
        tbody.html('<tr><td colspan="8" class="text-center text-muted py-4">暂无数据</td></tr>');
        return;
    }

    announcements.forEach(function(ann) {
        const statusBadge = ann.is_active
            ? '<span class="badge bg-success">已发布</span>'
            : '<span class="badge bg-secondary">草稿</span>';
        const pinnedBadge = ann.is_pinned ? '<span class="badge bg-primary">置顶</span>' : '';

        tbody.append(`
            <tr>
                <td><strong>${escHtml(ann.title)}</strong></td>
                <td><span class="badge bg-info">${ann.category_display}</span></td>
                <td><span class="badge bg-warning">${ann.priority_display}</span></td>
                <td>${statusBadge} ${pinnedBadge}</td>
                <td>${escHtml(ann.author_name)}</td>
                <td>${ann.created_at}</td>
                <td>${ann.view_count}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="editAnnouncement(${ann.id})"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteAnnouncement(${ann.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `);
    });
}

function showCreateModal() {
    $('#formTitle').text('发布公告');
    $('#editId').val('');
    $('#annTitle').val('');
    $('#annCategory').val('general');
    $('#annPriority').val('normal');
    $('#annActive').val('true');
    $('#annStartDate').val('');
    $('#annEndDate').val('');
    $('#annPinned').prop('checked', false);
    $('#annContent').val('');
    new bootstrap.Modal($('#formModal')).show();
}

function editAnnouncement(id) {
    $.get('/announcement/api/announcements/' + id, function(res) {
        if (res.success) {
            const ann = res.data;
            $('#formTitle').text('编辑公告');
            $('#editId').val(ann.id);
            $('#annTitle').val(ann.title);
            $('#annCategory').val(ann.category);
            $('#annPriority').val(ann.priority);
            $('#annActive').val(ann.is_active ? 'true' : 'false');
            $('#annStartDate').val(ann.start_date);
            $('#annEndDate').val(ann.end_date);
            $('#annPinned').prop('checked', ann.is_pinned);
            $('#annContent').val(ann.content);
            new bootstrap.Modal($('#formModal')).show();
        }
    });
}

function saveAnnouncement() {
    const id = $('#editId').val();
    const data = {
        title: $('#annTitle').val(),
        category: $('#annCategory').val(),
        priority: $('#annPriority').val(),
        is_active: $('#annActive').val() === 'true',
        is_pinned: $('#annPinned').prop('checked'),
        start_date: $('#annStartDate').val(),
        end_date: $('#annEndDate').val(),
        content: $('#annContent').val()
    };

    if (!data.title || !data.content) {
        alert('标题和内容不能为空');
        return;
    }

    const url = id ? '/announcement/api/announcements/' + id : '/announcement/api/announcements';
    const method = id ? 'PUT' : 'POST';

    $.ajax({url: url, method: method, contentType: 'application/json', data: JSON.stringify(data),
        success: function(res) {
            if (res.success) {
                bootstrap.Modal.getInstance($('#formModal')).hide();
                loadAnnouncements(currentPage);
            } else {
                alert(res.message);
            }
        }
    });
}

function deleteAnnouncement(id) {
    if (!confirm('确定要删除这条公告吗？')) return;
    $.ajax({url: '/announcement/api/announcements/' + id, method: 'DELETE',
        success: function(res) {
            if (res.success) {
                loadAnnouncements(currentPage);
            } else {
                alert(res.message);
            }
        }
    });
}

function renderPagination(pagination) {
    const ul = $('#pagination');
    ul.empty();
    if (pagination.pages <= 1) return;
    ul.append(`<li class="page-item ${pagination.has_prev ? '' : 'disabled'}"><a class="page-link" href="#" onclick="loadAnnouncements(${pagination.page - 1})">上一页</a></li>`);
    for (let i = 1; i <= pagination.pages; i++) {
        if (i === 1 || i === pagination.pages || (i >= pagination.page - 2 && i <= pagination.page + 2)) {
            ul.append(`<li class="page-item ${i === pagination.page ? 'active' : ''}"><a class="page-link" href="#" onclick="loadAnnouncements(${i})">${i}</a></li>`);
        }
    }
    ul.append(`<li class="page-item ${pagination.has_next ? '' : 'disabled'}"><a class="page-link" href="#" onclick="loadAnnouncements(${pagination.page + 1})">下一页</a></li>`);
}

function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
{% endblock %}
