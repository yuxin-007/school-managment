{% extends "base.html" %}

{% block content %}
<style>
/* ========== 整体布局优化 ========== */
.org-page {
    display: flex;
    gap: 20px;
    height: calc(100vh - 180px);
    min-height: 600px;
}

/* ========== 组织树容器 ========== */
.tree-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
}

.tree-header {
    padding: 16px 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.tree-header h5 {
    margin: 0;
    font-weight: 600;
}

.tree-body {
    flex: 1;
    padding: 24px;
    background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

/* ========== 组织树 jsTree 核心样式 ========== */
#organizationTree {
    font-family: 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
}

/* 根容器 - 水平居中 */
#organizationTree .jstree-container-ul {
    display: flex !important;
    flex-direction: column;
    align-items: center;
    padding: 0 !important;
    margin: 0 auto !important;
    list-style: none !important;
    background: transparent !important;
}

/* 每个树节点容器 - 垂直排列子节点 */
#organizationTree .jstree-node {
    display: flex !important;
    flex-direction: column;
    align-items: center;
    margin: 0 !important;
    padding: 0 !important;
    position: relative;
    border: none !important;
    background: transparent !important;
    list-style: none !important;
}

/* 子节点区域 */
#organizationTree .jstree-children {
    display: flex !important;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    padding: 20px 0 0 0 !important;
    margin: 0 !important;
    border: none !important;
    list-style: none;
    position: relative;
}

/* 父子节点连接线 - 垂直线 */
#organizationTree .jstree-children::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 16px;
    background: #cbd5e1;
}

/* 节点卡片 */
#organizationTree .jstree-anchor {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px !important;
    border-radius: 12px !important;
    background: white !important;
    color: #334155 !important;
    font-weight: 500;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: all 0.25s ease;
    border: 2px solid #e2e8f0;
    min-width: 120px;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
}

#organizationTree .jstree-anchor:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
    border-color: #667eea;
    color: #667eea !important;
}

#organizationTree .jstree-anchor:hover .fas,
#organizationTree .jstree-anchor:hover .fa {
    color: #667eea !important;
}

/* 选中状态 */
#organizationTree .jstree-clicked,
#organizationTree .jstree-anchor.jstree-clicked {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    color: white !important;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

#organizationTree .jstree-clicked .fas,
#organizationTree .jstree-clicked .fa {
    color: white !important;
}

/* 图标 */
#organizationTree .jstree-icon {
    font-size: 16px;
    width: auto;
    height: auto;
}

/* 隐藏默认展开按钮 */
#organizationTree .jstree-ocl {
    display: none !important;
}

/* ========== 根节点特殊样式 ========== */
#organizationTree > ul > li > .jstree-anchor {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    color: white !important;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 28px !important;
    border-radius: 25px !important;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    min-width: 150px;
}

#organizationTree > ul > li > .jstree-anchor .fas,
#organizationTree > ul > li > .jstree-anchor .fa {
    color: white !important;
}

/* ========== 层级颜色区分 ========== */
#organizationTree > ul > li .jstree-children > li > .jstree-anchor {
    background: #f1f5f9 !important;
    border-color: #cbd5e1;
}

#organizationTree > ul > li .jstree-children > li .jstree-children > li > .jstree-anchor {
    background: #e2e8f0 !important;
    border-color: #94a3b8;
}

#organizationTree > ul > li .jstree-children > li .jstree-children > li .jstree-children > li > .jstree-anchor {
    background: #cbd5e1 !important;
}

/* ========== 节点卡片类型颜色 ========== */
#organizationTree .jstree-anchor[data-type="school"] { border-left: 4px solid #3b82f6; }
#organizationTree .jstree-anchor[data-type="college"] { border-left: 4px solid #10b981; }
#organizationTree .jstree-anchor[data-type="dept"] { border-left: 4px solid #f59e0b; }
#organizationTree .jstree-anchor[data-type="staff"] { border-left: 4px solid #8b5cf6; }
#organizationTree .jstree-anchor[data-type="ug"] { border-left: 4px solid #06b6d4; }
#organizationTree .jstree-anchor[data-type="pg"] { border-left: 4px solid #ec4899; }
#organizationTree .jstree-anchor[data-type="class"] { border-left: 4px solid #84cc16; }

/* ========== 侧边操作面板 ========== */
.detail-section {
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.detail-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
}

.detail-card.hidden {
    display: none;
}

/* 提示卡片 */
.hint-card {
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    border: 1px solid #e2e8f0;
}

.hint-card .card-body {
    padding: 24px;
    text-align: center;
}

.hint-card .hint-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(102, 126, 234, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
}

.hint-card .hint-icon i {
    font-size: 28px;
    color: #667eea;
}

/* 节点详情卡片 */
.node-detail-card .card-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.node-detail-card .card-header h5 {
    margin: 0;
    font-weight: 600;
}

.node-detail-card .card-body {
    padding: 20px;
}

/* 节点信息展示 */
.node-info-display {
    margin-bottom: 20px;
}

.node-name-display {
    font-size: 18px;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.node-meta {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.node-meta-item {
    background: #f8fafc;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
}

.node-meta-item label {
    display: block;
    font-size: 12px;
    color: #64748b;
    margin-bottom: 4px;
}

.node-meta-item span {
    font-weight: 500;
    color: #334155;
}

/* 标签页 */
.detail-tabs {
    border-bottom: 2px solid #e2e8f0;
    margin-bottom: 16px;
}

.detail-tabs .nav-link {
    border: none;
    color: #64748b;
    font-weight: 500;
    padding: 12px 16px;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
}

.detail-tabs .nav-link:hover {
    color: #667eea;
    border-color: transparent;
}

.detail-tabs .nav-link.active {
    color: #667eea;
    border-bottom-color: #667eea;
}

/* 列表区域 */
.list-section {
    max-height: 280px;
    overflow-y: auto;
}

.list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.2s;
}

.list-item:hover {
    background: #f8fafc;
}

.list-item:last-child {
    border-bottom: none;
}

.list-item-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.list-item-actions {
    display: flex;
    gap: 6px;
}

.empty-state {
    text-align: center;
    padding: 32px 16px;
    color: #94a3b8;
}

.empty-state i {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: 0.5;
}

/* ========== 响应式 ========== */
@media (max-width: 991.98px) {
    .org-page {
        flex-direction: column;
        height: auto;
    }
    
    .tree-section {
        min-height: 450px;
    }
    
    .detail-section {
        width: 100%;
    }
    
    .tree-body {
        justify-content: flex-start;
        overflow-x: auto;
    }
    
    #organizationTree {
        min-width: max-content;
    }
}

@media (max-width: 575.98px) {
    .tree-header, .node-detail-card .card-header {
        padding: 12px 16px;
    }
    
    .tree-body {
        padding: 16px;
    }
    
    .node-meta {
        grid-template-columns: 1fr;
    }
}
</style>

<div class="d-flex justify-content-between align-items-center mb-3">

    <div class="btn-group" role="group">
        <button class="btn btn-outline-secondary btn-sm" id="refreshTreeBtn">

</div>

<script src="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/jstree.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/themes/default/style.min.css" rel="stylesheet">

<script>
let currentNode = null;
const userRole = '{{ user_role }}';

// 节点类型名称映射
const nodeTypeNames = {
    'system': '系统',
    'school': '学校',
    'college': '学院',
    'dept': '系/专业',
    'staff': '教职工',
    'ug': '本科生',
    'pg': '研究生',
    'class': '班级/小组',
    'org': '组织'
};

// 父节点类型 -> 可选的子节点类型
const allowedChildTypes = {
    'system': ['school'],
    'school': ['college'],
    'college': ['dept', 'staff', 'ug', 'pg', 'class', 'org'],
    'dept': ['staff', 'class', 'org'],
    'staff': ['class', 'org'],
    'ug': ['class', 'org'],
    'pg': ['class', 'org'],
    'class': ['org'],
    'org': ['org']
};

$(document).ready(function() {
    let isExpanded = false;
    loadOrganizationTree();

    $('#toggleExpandCollapseBtn').click(function() {
        if (isExpanded) {
            $('#organizationTree').jstree(true).close_all();
            $(this).html('<i class="fas fa-expand-alt me-1"></i>全部展开');
            isExpanded = false;
        } else {
            $('#organizationTree').jstree(true).open_all();
            $(this).html('<i class="fas fa-compress-alt me-1"></i>全部折叠');
            isExpanded = true;
        }
    });

    $('#refreshTreeBtn').click(() => loadOrganizationTree());
    $('#closeDetailCard').click(() => hideDetailPanel());
    
    // 操作按钮事件
    $(document).on('click', '#addChildNodeBtn', function() {
        if (currentNode) openNodeModal(null, currentNode.id);
        else showToast('请先选择一个节点', 'warning');
    });
    
    $(document).on('click', '#assignUserBtn', function() {
        if (currentNode) openAssignUserModal(currentNode.id);
        else showToast('请先选择一个节点', 'warning');
    });

    // 子节点操作
    $(document).on('click', '.edit-child', function() {
        let child = {
            id: $(this).data('id'),
            name: $(this).data('name'),
            code: $(this).data('code'),
            description: $(this).data('desc'),
            parent_id: currentNode.id
        };
        openNodeModal(child, currentNode.id);
    });

    $(document).on('click', '.delete-child', function() {
        if (confirm('确定删除此子节点？')) deleteNode($(this).data('id'));
    });

    // 人员操作
    $(document).on('click', '.remove-user', function() {
        if (confirm('确定移除该人员？')) removeUserFromNode($(this).data('user-id'), currentNode.id);
    });

    $('#nodeForm').submit(function(e) { e.preventDefault(); saveNode(); });
    $('#assignUserForm').submit(function(e) { e.preventDefault(); assignUser(); });

    loadUserOptions();
});

// 获取当前展开的节点 ID 列表
function getExpandedNodeIds() {
    const tree = $('#organizationTree').jstree(true);
    if (!tree) {
        console.log('[DEBUG] getExpandedNodeIds: tree not ready');
        return [];
    }
    
    // 方式1: 使用 tree.get_state()
    const state = tree.get_state();
    const openFromState = state.core.open || [];
    
    // 方式2: 通过 DOM 获取展开的节点（更可靠）
    const $tree = $('#organizationTree');
    const openFromDom = [];
    $tree.find('li.jstree-open').each(function() {
        openFromDom.push(this.id);
    });
    
    // 合并两种方式的结果（去重）
    const allOpen = [...new Set([...openFromState, ...openFromDom])];
    console.log('[DEBUG] getExpandedNodeIds: from state =', openFromState, 'from DOM =', openFromDom, 'merged =', allOpen);
    return allOpen;
}

// 恢复指定节点的展开状态
function restoreExpandedState(expandedIds) {
    const tree = $('#organizationTree').jstree(true);
    if (!tree) {
        console.log('[DEBUG] restoreExpandedState: tree not ready');
        return;
    }
    
    if (!expandedIds || expandedIds.length === 0) {
        console.log('[DEBUG] restoreExpandedState: no nodes to restore');
        return;
    }
    
    console.log('[DEBUG] restoreExpandedState: restoring', expandedIds.length, 'nodes');
    expandedIds.forEach(function(nodeId) {
        const $node = $('#' + nodeId);
        if ($node.length > 0) {
            console.log('[DEBUG] restoreExpandedState: opening node', nodeId);
            tree.open_node(nodeId);
        } else {
            console.log('[DEBUG] restoreExpandedState: node', nodeId, 'not found in DOM');
        }
    });
}

// 重新选中指定节点
function reselectNode(nodeId) {
    if (!nodeId) return;
    const tree = $('#organizationTree').jstree(true);
    if (!tree) return;
    
    // 转换为 node_XXX 格式
    let jstreeNodeId = String(nodeId);
    if (!jstreeNodeId.startsWith('node_')) {
        jstreeNodeId = 'node_' + jstreeNodeId;
    }
    
    if ($('#' + jstreeNodeId).length > 0) {
        tree.select_node(jstreeNodeId);
    }
}

function loadOrganizationTree(options = {}) {
    // 操作前保存当前状态
    const wasExpanded = getExpandedNodeIds();
    const previousSelectedId = currentNode ? currentNode.id : null;
    
    console.log('[DEBUG] loadOrganizationTree: wasExpanded =', wasExpanded, 'previousSelectedId =', previousSelectedId);
    
    $.get('/organization/api/tree')
        .done(function(response) {
            if (response.success) {
                if (response.data && response.data.length > 0) {
                    console.log('[DEBUG] loadOrganizationTree: calling initJsTree with preserveExpanded =', options.preserveExpanded !== false && wasExpanded.length > 0);
                    initJsTree(response.data, {
                        preserveExpanded: options.preserveExpanded !== false && wasExpanded.length > 0,
                        expandedIds: wasExpanded,
                        selectNodeId: options.selectNodeId || previousSelectedId
                    });
                } else {
                    $('#organizationTree').html('<div class="alert alert-info text-center">暂无组织节点，请联系管理员创建。</div>');
                }
            } else {
                showToast('加载组织树失败: ' + response.message, 'danger');
            }
        })
        .fail(function(xhr) {
            console.error(xhr);
            showToast('网络错误，无法加载组织树', 'danger');
        });
}

// 根据层级展开节点（递归版本）
function expandToLevel(tree, $nodes, targetLevel, currentLevel = 1) {
    if (currentLevel >= targetLevel) {
        return Promise.resolve();
    }
    const nextLevel = currentLevel + 1;
    const promises = [];
    $nodes.each(function() {
        const nodeId = $(this).attr('id');
        if (nodeId) {
            const $children = $(this).find('> ul > li');
            if ($children.length > 0) {
                const promise = new Promise((resolve) => {
                    tree.open_node(nodeId, () => {
                        expandToLevel(tree, $children, targetLevel, nextLevel).then(resolve);
                    });
                });
                promises.push(promise);
            }
        }
    });
    return Promise.all(promises).then(() => {});
}

// 根据层级展开节点（同步版本，使用setTimeout）
function expandToLevelSync(tree, $nodes, targetLevel, currentLevel = 1) {
    if (currentLevel >= targetLevel) {
        return;
    }
    const nextLevel = currentLevel + 1;
    $nodes.each(function() {
        const nodeId = $(this).attr('id');
        if (nodeId) {
            tree.open_node(nodeId);
            const $children = $(this).find('> ul > li');
            if ($children.length > 0) {
                setTimeout(() => {
                    expandToLevelSync(tree, $children, targetLevel, nextLevel);
                }, 50);
            }
        }
    });
}

function initJsTree(treeData, options = {}) {
    const preserveExpanded = options.preserveExpanded || false;
    const expandedIds = options.expandedIds || [];
    const selectNodeId = options.selectNodeId;
    
    $('#organizationTree').jstree('destroy').empty();
    $('#organizationTree')
        .jstree({
            'core': {
                'data': treeData,
                'themes': {
                    'name': 'default',
                    'dots': false,
                    'icons': true,
                    'responsive': false
                },
                'check_callback': true,
                'expand_selected_onload': false
            },
            'plugins': ['types'],
            'types': {
                'system': { 'icon': 'fas fa-cog' },
                'school': { 'icon': 'fas fa-university' },
                'college': { 'icon': 'fas fa-building' },
                'dept': { 'icon': 'fas fa-archway' },
                'staff': { 'icon': 'fas fa-chalkboard-teacher' },
                'ug': { 'icon': 'fas fa-user-graduate' },
                'pg': { 'icon': 'fas fa-graduation-cap' },
                'class': { 'icon': 'fas fa-users' },
                'org': { 'icon': 'fas fa-sitemap' },
                'default': { 'icon': 'fas fa-folder' }
            }
        })
        .on('select_node.jstree', function(e, data) {
            handleNodeSelect(data.node);
        })
        .on('ready.jstree', function(e, data) {
            const tree = $(this).jstree(true);
            console.log('[DEBUG] ready.jstree: preserveExpanded =', preserveExpanded, 'expandedIds =', expandedIds);
            
            if (preserveExpanded && expandedIds && expandedIds.length > 0) {
                // 恢复之前展开的节点 - 使用 loaded.jstree 事件，因为节点需要完全加载后才能操作
                // ready.jstree 触发时 DOM 可能还没完全构建
            } else {
                console.log('[DEBUG] ready.jstree: using default expand behavior');
                // 默认行为：根据用户角色展开对应层级
                const $rootNodes = $(this).find('> ul > li');
                if (userRole === 'super_admin') {
                    // 系统管理员：展开到学校节点（展开两级：根节点 + 学校）
                    expandToLevelSync(tree, $rootNodes, 2);
                } else if (userRole === 'college_admin') {
                    // 学院管理员：展开学院下两级
                    expandToLevelSync(tree, $rootNodes, 2);
                }
            }
        })
        .on('loaded.jstree', function(e, data) {
            // loaded.jstree 在所有节点加载完成后触发，此时 DOM 完全可用
            console.log('[DEBUG] loaded.jstree: preserveExpanded =', preserveExpanded, 'expandedIds =', expandedIds);
            const tree = $(this).jstree(true);
            
            if (preserveExpanded && expandedIds && expandedIds.length > 0) {
                console.log('[DEBUG] loaded.jstree: restoring expanded state');
                restoreExpandedState(expandedIds);
                // 如果需要重新选中节点
                if (selectNodeId) {
                    console.log('[DEBUG] loaded.jstree: reselecting node', selectNodeId);
                    reselectNode(selectNodeId);
                }
            }
        })
        .on('error.jstree', function(e, data) {
            console.error('jsTree错误:', data);
            showToast('树加载出错，请刷新页面', 'danger');
        });
}

function handleNodeSelect(node) {
    console.log('handleNodeSelect - node.id:', node.id, 'node.type:', node.type, 'node.data:', node.data);
    if (node && node.data && node.data.id) {
        // 使用后端返回的整数 ID
        currentNode = node.data;
        currentNode.type = node.type;  // jsTree 的 type
        currentNode.id = node.data.id; // 确保是整数
        console.log('handleNodeSelect - 使用 data.id:', currentNode.id);
        showDetailPanel(currentNode);
    } else if (node) {
        // 备用：使用 jsTree 的字符串 ID，转换为整数
        const intId = node.id ? parseInt(node.id.replace('node_', '')) : null;
        currentNode = {
            id: intId,
            name: node.text,
            node_type: node.type || 'default',
            type: node.type || 'default',  // 统一设置 type
            code: '',
            description: ''
        };
        console.log('handleNodeSelect - fallback currentNode.id:', currentNode.id);
        showDetailPanel(currentNode);
    }
}

function showDetailPanel(node) {
    $('#hintCard').addClass('hidden');
    $('#detailCard').removeClass('hidden');
    
    $('#detailNodeName').text(node.name);
    $('#detailNodeType').text(node.node_type || '默认');
    $('#detailNodeCode').text(node.code || '-');
    $('#detailNodeDesc').text(node.description || '无描述');
    
    // 加载子节点和人员
    loadChildrenList(node.id);
    loadNodeUsers(node.id);
}

function hideDetailPanel() {
    $('#detailCard').addClass('hidden');
    $('#hintCard').removeClass('hidden');
    currentNode = null;
    // 取消树节点选中
    $('#organizationTree').jstree('deselect_all');
}

function loadChildrenList(nodeId) {
    $.get(`/organization/api/node/${nodeId}/children`, function(res) {
        if (res.success) {
            let html = '';
            if (res.data.length === 0) {
                html = '<div class="empty-state"><i class="fas fa-folder-open"></i><p class="mb-0">暂无子节点</p></div>';
            } else {
                res.data.forEach(child => {
                    html += `<div class="list-item">
                        <div class="list-item-info">
                            <i class="fas fa-folder text-warning"></i>
                            <div>
                                <div class="fw-medium">${escHtml(child.name)}</div>
                                <small class="text-muted">${child.node_type}</small>
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn btn-sm btn-outline-primary edit-child" data-id="${child.id}" data-name="${escHtml(child.name)}" data-code="${escHtml(child.code||'')}" data-desc="${escHtml(child.description||'')}"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-outline-danger delete-child" data-id="${child.id}"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                });
            }
            $('#childrenList').html(html);
            $('#childrenCount').text(res.data.length);
        } else {
            showToast(res.message, 'danger');
        }
    }).fail(() => showToast('加载子节点失败', 'danger'));
}

function loadNodeUsers(nodeId) {
    $.get(`/organization/api/node/${nodeId}/users`, function(res) {
        if (res.success) {
            let html = '';
            if (res.data.length === 0) {
                html = '<div class="empty-state"><i class="fas fa-user-friends"></i><p class="mb-0">暂无人员</p></div>';
            } else {
                res.data.forEach(u => {
                    html += `<div class="list-item">
                        <div class="list-item-info">
                            <i class="fas fa-user text-info"></i>
                            <div>
                                <div class="fw-medium">${escHtml(u.real_name)}</div>
                                <small class="text-muted">${u.role_display || u.role}${u.role_in_node ? ' · ' + u.role_in_node : ''}</small>
                                ${u.is_primary ? '<span class="badge bg-primary ms-1">主节点</span>' : ''}
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn btn-sm btn-outline-danger remove-user" data-user-id="${u.id}"><i class="fas fa-times"></i></button>
                        </div>
                    </div>`;
                });
            }
            $('#usersList').html(html);
            $('#usersCount').text(res.data.length);
        } else {
            showToast(res.message, 'danger');
        }
    }).fail(() => showToast('加载人员失败', 'danger'));
}

function openNodeModal(node, parentId) {
    // 重置类型选择的 required 属性
    $('#nodeTypeSelect').prop('required', true);

    if (node) {
        $('#nodeModalTitle').text('编辑节点');
        $('#nodeId').val(node.id);
        $('#nodeNameInput').val(node.name);
        $('#nodeCodeInput').val(node.code || '');
        $('#nodeDescInput').val(node.description || '');
        // 编辑时隐藏类型选择（避免类型错误）
        $('#nodeTypeSelect').closest('.mb-3').hide();
    } else {
        $('#nodeModalTitle').text('添加子节点');
        $('#nodeId').val('');
        $('#nodeNameInput').val('');
        $('#nodeCodeInput').val('');
        $('#nodeDescInput').val('');

        // 直接使用 currentNode 的类型（已在 handleNodeSelect 中设置）
        let parentType = currentNode && currentNode.type ? currentNode.type : 'system';

        // 系统根节点和学校节点：固定类型，不显示选择
        // 学院及以下：需要选择类型
        if (parentType === 'system' || parentType === 'school') {
            // 固定为单一类型，隐藏选择，并移除 required（因为是隐藏的）
            $('#nodeTypeSelect').closest('.mb-3').hide();
            $('#nodeTypeSelect').prop('required', false);
        } else {
            // 多种类型可选，显示选择
            $('#nodeTypeSelect').closest('.mb-3').show();
            $('#nodeTypeSelect').prop('required', true);
            populateNodeTypeSelect(parentId);
        }
    }
    // 保存父节点 ID（使用 currentNode.id 整数值，后端会处理）
    $('#nodeForm').data('parent-id', currentNode ? currentNode.id : null);
    $('#nodeModal').modal('show');
}

// 根据父节点类型填充可选的子节点类型
function populateNodeTypeSelect(parentNodeId) {
    const $select = $('#nodeTypeSelect');
    $select.empty().append('<option value="">请选择节点类型</option>');

    // 获取父节点类型
    let parentType = 'system';
    if (parentNodeId) {
        const tree = $('#organizationTree').jstree(true);
        const parentNode = tree.get_node(parentNodeId);
        if (parentNode) {
            parentType = parentNode.type || 'system';
        }
    }

    // 获取允许的子节点类型
    const allowedTypes = allowedChildTypes[parentType] || [];

    // 添加选项
    allowedTypes.forEach(type => {
        const name = nodeTypeNames[type] || type;
        $select.append(`<option value="${type}">${name}</option>`);
    });

    if (allowedTypes.length === 0) {
        $select.append('<option value="">该节点不能添加子节点</option>');
    }
}

function saveNode() {
    const id = $('#nodeId').val();
    const url = id ? `/organization/api/node/${id}` : '/organization/api/node';
    const method = id ? 'PUT' : 'POST';
    const parentId = $('#nodeForm').data('parent-id');

    console.log('保存节点 - id:', id, 'parentId:', parentId, 'url:', url, 'method:', method);

    const data = {
        name: $('#nodeNameInput').val().trim(),
        code: $('#nodeCodeInput').val().trim(),
        description: $('#nodeDescInput').val().trim()
    };

    // 只有新增节点才发送 parent_id
    if (!id && parentId) {
        data.parent_id = parentId;
    }

    console.log('保存节点 - 发送的数据:', data);

    // 新增节点时设置类型
    if (!id) {
        // 直接使用 currentNode 的类型
        const parentType = currentNode && currentNode.type ? currentNode.type : 'system';

        // 系统根节点下：固定为学校；学校下：固定为学院；其他：用户选择
        if (parentType === 'system') {
            data.node_type = 'school';
        } else if (parentType === 'school') {
            data.node_type = 'college';
        } else {
            const nodeType = $('#nodeTypeSelect').val();
            if (!nodeType) {
                showToast('请选择节点类型', 'warning');
                return;
            }
            data.node_type = nodeType;
        }
    }

    if (!data.name) { showToast('节点名称不能为空', 'warning'); return; }

    // 获取 jsTree 节点 ID 格式（用于重新选中）
    let jstreeNodeId = null;
    if (currentNode && currentNode.id) {
        // 如果 currentNode.id 已经是 node_XXX 格式
        if (String(currentNode.id).startsWith('node_')) {
            jstreeNodeId = currentNode.id;
        } else {
            // 如果是整数，转换为 node_XXX 格式
            jstreeNodeId = 'node_' + currentNode.id;
        }
    }

    $.ajax({
        url: url, method: method, contentType: 'application/json', data: JSON.stringify(data),
        success: function(res) {
            console.log('保存成功 - 响应:', res);
            if (res.success) {
                $('#nodeModal').modal('hide');
                loadOrganizationTree();
                if (jstreeNodeId) {
                    setTimeout(() => {
                        $('#organizationTree').jstree('select_node', jstreeNodeId);
                    }, 300);
                }
                showToast(id ? '更新成功' : '添加成功', 'success');
            } else {
                console.error('保存失败 - 错误:', res.message);
                showToast(res.message, 'danger');
            }
        },
        error: function(xhr) {
            console.error('请求失败:', xhr);
            showToast('请求失败: ' + (xhr.responseJSON ? xhr.responseJSON.message : '网络错误'), 'danger');
        }
    });
}

function deleteNode(nodeId) {
    $.ajax({
        url: `/organization/api/node/${nodeId}`, method: 'DELETE',
        success: function(res) {
            if (res.success) {
                loadOrganizationTree();
                showToast('删除成功', 'success');
                if (currentNode && currentNode.id == nodeId) hideDetailPanel();
            } else showToast(res.message, 'danger');
        }
    });
}

function loadUserOptions() {
    $.get('/organization/api/users/options', function(res) {
        if (res.success) {
            let opts = '<option value="">请选择</option>';
            res.data.forEach(u => opts += `<option value="${u.id}">${escHtml(u.name)}</option>`);
            $('#userSelect').html(opts);
        }
    });
}

function openAssignUserModal(nodeId) {
    $('#assignNodeId').val(nodeId);
    $('#roleInNode').val('');
    $('#isPrimaryCheck').prop('checked', false);
    $('#assignUserModal').modal('show');
}

function assignUser() {
    const data = {
        user_id: $('#userSelect').val(),
        node_id: $('#assignNodeId').val(),
        role_in_node: $('#roleInNode').val(),
        is_primary: $('#isPrimaryCheck').is(':checked')
    };
    if (!data.user_id) { showToast('请选择人员', 'warning'); return; }
    $.ajax({
        url: '/organization/api/assign-user', method: 'POST', contentType: 'application/json', data: JSON.stringify(data),
        success: function(res) {
            if (res.success) {
                $('#assignUserModal').modal('hide');
                loadNodeUsers(data.node_id);
                showToast('分配成功', 'success');
            } else showToast(res.message, 'danger');
        }
    });
}

function removeUserFromNode(userId, nodeId) {
    $.ajax({
        url: `/organization/api/remove-user/${userId}?node_id=${nodeId}`, method: 'DELETE',
        success: function(res) {
            if (res.success) {
                loadNodeUsers(nodeId);
                showToast('移除成功', 'success');
            } else showToast(res.message, 'danger');
        }
    });
}

function escHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
    const toast = $(`<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;"><div class="toast show align-items-center text-white bg-${type} border-0"><div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>`);
    $('body').append(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
