{% extends "base.html" %}

{% block title %}考勤管理 - 学校管理系统{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4"><i class="fas fa-clock me-2"></i>考勤管理</h2>

        <!-- 筛选 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-2">
                        <input type="text" class="form-control" id="keyword" placeholder="搜索姓名">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="statusFilter">
                            <option value="">全部状态</option>
                            <option value="normal">正常</option>
                            <option value="late">迟到</option>
                            <option value="early">早退</option>
                            <option value="absent">缺勤</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="endDate">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="loadAttendance(1)"><i class="fas fa-search me-1"></i>查询</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 考勤列表 -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>日期</th>
                                <th>上班时间</th>
                                <th>下班时间</th>
                                <th>状态</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTable"></tbody>
                    </table>
                </div>
                <nav>
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- 编辑 Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">修改考勤记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label">状态</label>
                    <select class="form-select" id="editStatus">
                        <option value="normal">正常</option>
                        <option value="late">迟到</option>
                        <option value="early">早退</option>
                        <option value="absent">缺勤</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">备注</label>
                    <input type="text" class="form-control" id="editRemark">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveAttendance()">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

$(function() {
    loadAttendance();
});

function loadAttendance(page = 1) {
    currentPage = page;
    $.get('/attendance/api/attendance/all', {
        page: page,
        per_page: 20,
        keyword: $('#keyword').val(),
        status: $('#statusFilter').val(),
        start_date: $('#startDate').val(),
        end_date: $('#endDate').val()
    }, function(res) {
        if (res.success) {
            renderTable(res.data);
            renderPagination(res.pagination);
        }
    });
}

function renderTable(records) {
    const tbody = $('#attendanceTable');
    tbody.empty();

    if (records.length === 0) {
        tbody.html('<tr><td colspan="7" class="text-center text-muted py-4">暂无数据</td></tr>');
        return;
    }

    records.forEach(function(r) {
        const statusBadge = {
            'normal': '<span class="badge bg-success">正常</span>',
            'late': '<span class="badge bg-warning text-dark">迟到</span>',
            'early': '<span class="badge bg-info">早退</span>',
            'absent': '<span class="badge bg-danger">缺勤</span>'
        }[r.status] || '<span class="badge bg-secondary">未知</span>';

        tbody.append(`
            <tr>
                <td><strong>${escHtml(r.user_name)}</strong></td>
                <td>${r.attendance_date}</td>
                <td>${r.clock_in ? r.clock_in.split(' ')[1].substring(0, 5) : '<span class="text-muted">--</span>'}</td>
                <td>${r.clock_out ? r.clock_out.split(' ')[1].substring(0, 5) : '<span class="text-muted">--</span>'}</td>
                <td>${statusBadge}</td>
                <td>${escHtml(r.remark || '')}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="editAttendance(${r.id}, '${r.status}', '${escHtml(r.remark || '')}')">
                        <i class="fas fa-edit"></i>
                    </button>
                </td>
            </tr>
        `);
    });
}

function editAttendance(id, status, remark) {
    $('#editId').val(id);
    $('#editStatus').val(status);
    $('#editRemark').val(remark);
    new bootstrap.Modal($('#editModal')).show();
}

function saveAttendance() {
    const id = $('#editId').val();
    $.ajax({
        url: '/attendance/api/attendance/' + id,
        method: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify({
            status: $('#editStatus').val(),
            remark: $('#editRemark').val()
        }),
        success: function(res) {
            if (res.success) {
                bootstrap.Modal.getInstance($('#editModal')).hide();
                loadAttendance(currentPage);
            }
        }
    });
}

function renderPagination(pagination) {
    const ul = $('#pagination');
    ul.empty();
    if (pagination.pages <= 1) return;
    ul.append(`<li class="page-item ${pagination.has_prev ? '' : 'disabled'}"><a class="page-link" href="#" onclick="loadAttendance(${pagination.page - 1})">上一页</a></li>`);
    for (let i = 1; i <= pagination.pages; i++) {
        if (i === 1 || i === pagination.pages || (i >= pagination.page - 2 && i <= pagination.page + 2)) {
            ul.append(`<li class="page-item ${i === pagination.page ? 'active' : ''}"><a class="page-link" href="#" onclick="loadAttendance(${i})">${i}</a></li>`);
        }
    }
    ul.append(`<li class="page-item ${pagination.has_next ? '' : 'disabled'}"><a class="page-link" href="#" onclick="loadAttendance(${pagination.page + 1})">下一页</a></li>`);
}

function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
{% endblock %}
