{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-chalkboard-teacher me-2"></i>教师信息</h2>
    <div>
        <a class="btn btn-outline-secondary" href="{{ url_for('user.statistics') }}">
            <i class="fas fa-arrow-left me-1"></i>返回用户统计
        </a>
        <button class="btn btn-primary" onclick="loadStaffByCollege()">
            <i class="fas fa-sync-alt me-1"></i>刷新
        </button>
    </div>
</div>

<!-- Toast -->
<div class="position-fixed top-0 end-0 p-3" style="z-index:1100">
    <div id="appToast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- 筛选栏 -->
<div class="card mb-3">
    <div class="card-body py-2">
        <div class="row g-2 align-items-center">
            <div class="col-md-4">
                <input type="text" id="searchKeyword" class="form-control" placeholder="搜索姓名/工号...">
            </div>
            <div class="col-md-2">
                <select id="filterCollege" class="form-select">
                    <option value="">全部学院</option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="filterStatus" class="form-select">
                    <option value="">全部状态</option>
                    <option value="1">正常</option>
                    <option value="0">禁用</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="applyStaffFilter()">
                    <i class="fas fa-search me-1"></i>筛选
                </button>
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" onclick="resetStaffFilter()">
                    <i class="fas fa-redo me-1"></i>重置
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 总计信息 -->
<div class="alert alert-primary mb-3" id="totalAlert" style="display:none">
    <i class="fas fa-info-circle me-1"></i>共 <strong id="totalCount">0</strong> 名教师，当前显示 <strong id="filteredCount">0</strong> 名
</div>

<div id="staffLoading" class="text-center py-5" style="display:none">
    <div class="spinner-border text-primary mb-2"></div>
    <p class="text-muted">加载中...</p>
</div>

<div id="staffContent"></div>

<!-- 编辑教师模态框 -->
<div class="modal fade" id="editStaffModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalTitle">编辑教师</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editStaffForm">
                <div class="modal-body">
                    <input type="hidden" id="editStaffId">
                    <div class="mb-3"><label>工号</label><input type="text" class="form-control" id="editEmployeeId" readonly></div>
                    <div class="mb-3"><label>真实姓名 *</label><input type="text" class="form-control" id="editRealName" required></div>
                    <div class="mb-3"><label>邮箱</label><input type="email" class="form-control" id="editEmail"></div>
                    <div class="mb-3"><label>手机号</label><input type="tel" class="form-control" id="editPhone"></div>
                    <div class="mb-3"><label>职位</label><input type="text" class="form-control" id="editPosition"></div>
                    <div class="mb-3"><label>角色</label>
                        <select class="form-control" id="editRole">
                            <option value="college_admin">学院管理员</option>
                            <option value="staff">教职工</option>
                            <option value="student">学生</option>
                        </select>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="editIsActive">
                        <label class="form-check-label" for="editIsActive">账户启用</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let staffData = null;  // 缓存数据

function showToast(msg, type) {
    const toast = document.getElementById('appToast');
    const toastMsg = document.getElementById('toastMsg');
    toast.className = 'toast align-items-center text-white border-0 bg-' + (type || 'success');
    toastMsg.textContent = msg;
    new bootstrap.Toast(toast, {delay: 3000}).show();
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

$(function() {
    loadStaffByCollege();
    $('#editStaffForm').submit(function(e) {
        e.preventDefault();
        saveEditStaff();
    });
    // 回车搜索
    $('#searchKeyword').on('keyup', function(e) {
        if (e.key === 'Enter') applyStaffFilter();
    });
});

function loadStaffByCollege() {
    $('#staffLoading').show();
    $('#staffContent').empty();
    $('#totalAlert').hide();

    $.get('/user/api/users/staff-by-college', res => {
        $('#staffLoading').hide();
        if (!res.success) {
            showToast('加载教师信息失败', 'danger');
            return;
        }
        staffData = res.data;
        $('#totalCount').text(staffData.total);
        $('#totalAlert').show();

        // 填充学院下拉框
        const collegeSelect = $('#filterCollege');
        collegeSelect.find('option:not(:first)').remove();
        staffData.colleges.forEach(c => {
            collegeSelect.append(`<option value="${c.college_id}">${escHtml(c.college_name)}</option>`);
        });

        applyStaffFilter();
    }).fail(() => {
        $('#staffLoading').hide();
        showToast('加载教师信息失败', 'danger');
    });
}

function applyStaffFilter() {
    if (!staffData) return;

    const keyword = $('#searchKeyword').val().toLowerCase().trim();
    const collegeId = $('#filterCollege').val();
    const status = $('#filterStatus').val();

    let totalFiltered = 0;
    let html = '';

    // 按学院分组筛选
    staffData.colleges.forEach(c => {
        // 筛选学院
        if (collegeId && c.college_id != collegeId) return;

        const filteredStaff = c.staff.filter(s => {
            if (keyword && !s.real_name.toLowerCase().includes(keyword) && !s.number.toLowerCase().includes(keyword)) return false;
            if (status && String(s.is_active) !== status) return false;
            return true;
        });

        if (filteredStaff.length > 0) {
            totalFiltered += filteredStaff.length;
            html += `
<div class="card mb-4 border-primary">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <strong><i class="fas fa-building me-2"></i>${escHtml(c.college_name)}</strong>
        <span class="badge bg-light text-primary">${filteredStaff.length} / ${c.count} 人</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>工号</th>
                        <th>姓名</th>
                        <th>邮箱</th>
                        <th>手机号</th>
                        <th>学院</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>`;
            filteredStaff.forEach(s => {
                html += `<tr>
                    <td><span class="badge bg-secondary">${escHtml(s.number)}</span></td>
                    <td><strong>${escHtml(s.real_name)}</strong></td>
                    <td>${escHtml(s.email)}</td>
                    <td>${escHtml(s.phone)}</td>
                    <td><span class="badge bg-primary">${escHtml(c.college_name)}</span></td>
                    <td><span class="badge ${s.is_active ? 'bg-success' : 'bg-danger'}">${s.is_active ? '正常' : '禁用'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-info" onclick="openEditModal(${s.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table></div></div></div>`;
        }
    });

    // 未分配学院的教师
    if (!collegeId) {
        const filteredUnassigned = staffData.unassigned.filter(s => {
            if (keyword && !s.real_name.toLowerCase().includes(keyword) && !s.number.toLowerCase().includes(keyword)) return false;
            if (status && String(s.is_active) !== status) return false;
            return true;
        });

        if (filteredUnassigned.length > 0) {
            totalFiltered += filteredUnassigned.length;
            html += `
<div class="card mb-4 border-secondary">
    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
        <strong><i class="fas fa-question-circle me-2"></i>未分配学院</strong>
        <span class="badge bg-light text-secondary">${filteredUnassigned.length} / ${staffData.unassigned.length} 人</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>工号</th>
                        <th>姓名</th>
                        <th>邮箱</th>
                        <th>手机号</th>
                        <th>学院</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>`;
            filteredUnassigned.forEach(s => {
                html += `<tr>
                    <td><span class="badge bg-secondary">${escHtml(s.number)}</span></td>
                    <td><strong>${escHtml(s.real_name)}</strong></td>
                    <td>${escHtml(s.email)}</td>
                    <td>${escHtml(s.phone)}</td>
                    <td><span class="badge bg-secondary">未分配</span></td>
                    <td><span class="badge ${s.is_active ? 'bg-success' : 'bg-danger'}">${s.is_active ? '正常' : '禁用'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-info" onclick="openEditModal(${s.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table></div></div></div>`;
        }
    }

    $('#filteredCount').text(totalFiltered);

    if (!html) {
        html = `<div class="text-center text-muted py-5">
            <i class="fas fa-search fa-3x mb-3"></i>
            <p>没有找到符合条件的教师</p>
        </div>`;
    }

    $('#staffContent').html(html);
}

function resetStaffFilter() {
    $('#searchKeyword').val('');
    $('#filterCollege').val('');
    $('#filterStatus').val('');
    applyStaffFilter();
}

// 打开编辑弹窗
function openEditModal(userId) {
    // 先获取用户详情
    $.get('/user/api/users/' + userId, res => {
        if (!res.success) {
            showToast('获取用户信息失败', 'danger');
            return;
        }
        let u = res.data;
        $('#editStaffId').val(u.id);
        $('#editEmployeeId').val(u.employee_id || '');
        $('#editRealName').val(u.real_name || '');
        $('#editEmail').val(u.email || '');
        $('#editPhone').val(u.phone || '');
        $('#editPosition').val(u.position || '');
        $('#editRole').val(u.role);
        $('#editIsActive').prop('checked', u.is_active);
        new bootstrap.Modal(document.getElementById('editStaffModal')).show();
    });
}

// 保存编辑
function saveEditStaff() {
    let id = $('#editStaffId').val();
    let data = {
        real_name: $('#editRealName').val(),
        email: $('#editEmail').val(),
        phone: $('#editPhone').val(),
        position: $('#editPosition').val(),
        role: $('#editRole').val(),
        is_active: $('#editIsActive').is(':checked')
    };
    $.ajax({
        url: '/user/api/users/' + id,
        method: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: res => {
            if (res.success) {
                bootstrap.Modal.getInstance(document.getElementById('editStaffModal')).hide();
                loadStaffByCollege();
                showToast('教师信息已更新', 'success');
            } else {
                showToast('错误: ' + res.message, 'danger');
            }
        },
        error: () => showToast('请求失败', 'danger')
    });
}
</script>
{% endblock %}
