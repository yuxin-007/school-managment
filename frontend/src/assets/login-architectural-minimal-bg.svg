<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" role="img" aria-label="Minimal campus architecture background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3f2"/>
      <stop offset="0.42" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb6b2" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#c5dddd" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f7fbfb" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="glassDeep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f9f9c" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#e9f4f2" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="plaza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#eef3f2" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="tealPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8dcda" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7bbebb" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="mist" cx="57%" cy="42%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="floorGrid" width="168" height="168" patternUnits="userSpaceOnUse">
      <path d="M 168 0 L 0 168" fill="none" stroke="#d8dfdf" stroke-width="1" stroke-opacity="0.46"/>
      <path d="M 0 168 H 168" fill="none" stroke="#d8dfdf" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 0 V 14" stroke="#b8c8c8" stroke-width="1" stroke-opacity="0.24"/>
    </pattern>
  </defs>

  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#mist)"/>

